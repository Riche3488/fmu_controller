[project]
name = "fmu-controller-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cmaes==0.12.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.1.6",
  "pydantic==2.14.1",
  "sse-starlette==3.6.0",
  "fmpy==0.3.32",
  "numpy==2.5.4",
  "pandas==3.1.0",
  "pyarrow==26.0.0",
  "scipy==1.18.1",
  "optuna==5.0.0",
]

[project.optional-dependencies]
ray = ["ray[default]==2.59.0"]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
